# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# DataSource (XAMPP / Local MySQL)
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASS}
#spring.datasource.url=jdbc:mysql://68.178.164.161:3306/inventory_db
#spring.datasource.username=muhib
#spring.datasource.password=12345678aA@p
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

