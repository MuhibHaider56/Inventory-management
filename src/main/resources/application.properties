# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Flyway
# ===============================
#spring.flyway.enabled=true
#spring.flyway.baseline-on-migrate=true
#spring.flyway.baseline-version=1
#spring.flyway.locations=classpath:db/migration

# Avoid "No serializer found" for lazy entities (we use DTOs anyway)
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# ===============================
# Logging (optional)
# ===============================
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO


# ===============================
# Swagger / OpenAPI (springdoc)
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
server.forward-headers-strategy=framework

# ===============================
# Session
# ===============================
server.servlet.session.timeout=4h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ===============================
# Company Info (used on invoices/PDFs)
# ===============================
app.company.name=Anees Traders
app.company.address=123 Main Street, Karachi
app.company.phone=0300-1234567
app.company.ntn=NTN: 0000000-0

# ===============================
# Purge
# ===============================
app.purge.retention-days=30